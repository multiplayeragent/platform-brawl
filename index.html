<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Platform Brawl</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none; background: #2a1b4a; }
  body { font: 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #fff; user-select: none; -webkit-user-select: none; }
  canvas { display: block; width: 100vw; height: 100vh; height: 100dvh; touch-action: none; }
  .hud { position: fixed; pointer-events: none; text-shadow: 0 2px 4px #0009; }
  #cards { top: max(10px, env(safe-area-inset-top)); left: 0; right: 0; display: flex; justify-content: center; gap: 10px; padding: 0 10px; }
  .pc { min-width: 74px; padding: 4px 10px 6px; border-radius: 12px; background: #0006; border-bottom: 4px solid var(--c); text-align: center; }
  .pc b { display: block; font: 900 28px/1 system-ui, sans-serif; font-variant-numeric: tabular-nums; }
  .pc small { display: block; font-size: 11px; font-weight: 700; opacity: .9; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 96px; }
  .pc i { display: inline-block; width: 9px; height: 9px; margin: 3px 2px 0; border-radius: 50%; background: var(--c); }
  .pc.out { opacity: .35; } .pc.me small { color: #ffd166; }
  #msg { top: 30%; left: 0; right: 0; text-align: center; font: 900 64px/1 system-ui, sans-serif; color: #ffd166; -webkit-text-stroke: 3px #4a1d00; }
  #msg small { display: block; margin-top: 10px; font-size: 18px; color: #fff; -webkit-text-stroke: 0; }
  #hint { top: calc(max(10px, env(safe-area-inset-top)) + 84px); left: 0; right: 0; text-align: center; font-size: 14px; }
  #net { bottom: max(4px, env(safe-area-inset-bottom)); left: 0; right: 0; text-align: center; font-size: 12px; opacity: .75; }
  #over { position: fixed; inset: 0; display: grid; place-items: center; background: #1a0f30a8; }
  #over[hidden], .pad[hidden] { display: none; }
  .card { box-sizing: border-box; width: min(402px, calc(100vw - 32px)); max-height: 86vh; overflow: auto; padding: 20px; border-radius: 16px; background: #2b1d4f; border: 1px solid #ffffff2e; text-align: center; }
  .card h2 { margin: 0 0 4px; font-size: 28px; color: #ffd166; } .card h3 { margin: 14px 0 4px; font-size: 13px; color: #ff9fd1; text-align: left; }
  .card ol { margin: 0; padding-left: 24px; font-size: 14px; text-align: left; }
  .card li span { float: right; font-variant-numeric: tabular-nums; } .card li.me { color: #ffd166; font-weight: 700; }
  .card p { margin: 10px 0 0; font-size: 13px; opacity: .75; }
  button.go { width: 100%; min-height: 48px; margin-top: 16px; border: 0; border-radius: 12px; background: #ffd166; color: #3a2400; font: 800 17px system-ui, sans-serif; cursor: pointer; }
  .pad { position: fixed; bottom: calc(max(14px, env(safe-area-inset-bottom)) + 16px); touch-action: none; }
  .pad button { position: absolute; width: 58px; height: 58px; border-radius: 14px; border: 2px solid #ffffff77; background: #00000040; color: #fff; font: 800 18px system-ui, sans-serif; touch-action: none; }
  .pad button.on { background: #ffffff55; }
  #dpad { left: max(12px, env(safe-area-inset-left)); width: 174px; height: 174px; }
  #dpad [data-k=left] { left: 0; top: 58px; } #dpad [data-k=right] { left: 116px; top: 58px; } #dpad [data-k=up] { left: 58px; top: 0; } #dpad [data-k=down] { left: 58px; top: 116px; }
  #acts { right: max(12px, env(safe-area-inset-right)); width: 164px; height: 150px; }
  #acts button { width: 76px; height: 76px; border-radius: 50%; font-size: 15px; }
  #acts [data-k=attack] { right: 0; top: 0; background: #ff5d7366; } #acts [data-k=jump] { left: 0; top: 70px; background: #4cc9f066; }
  @media (max-width: 440px) { #cards { gap: 6px; padding: 0 6px; } .pc { min-width: 0; padding: 4px 8px 6px; } } /* four cards fit a phone */
</style>
<script src="https://cdn.multiplayeragent.com/sdk/mp.global.js"></script>
</head>
<body>
<canvas id="game"></canvas>
<div class="hud" id="cards"></div>
<div class="hud" id="msg"></div>
<div class="hud" id="hint"></div>
<div class="hud" id="net">Connecting…</div>
<div class="pad" id="dpad" hidden><button data-k="up">▲</button><button data-k="left">◀</button><button data-k="right">▶</button><button data-k="down">▼</button></div>
<div class="pad" id="acts" hidden><button data-k="attack">HIT</button><button data-k="jump">JUMP</button></div>
<div id="over" hidden><div class="card">
  <h2 id="overTitle"></h2><div id="overSub"></div>
  <h3>This match</h3><ol id="results"></ol>
  <h3>Most wins</h3><ol id="board"><li>Loading…</li></ol>
  <button class="go" id="again">Play again</button><p id="next"></p>
</div></div>
<script>
/* ═══ PLATFORM BRAWL · a Multiplayer Agent starter ════════════════════════════════════
 * Knock your rivals off the stage. Versus, 2–4 players; bots fill empty seats.
 *
 * WHERE THINGS ARE (search for the "── " headers):
 *   CONFIG ........ stocks, jumps, speeds, how hard hits launch, bots
 *   STAGE ......... the island, the floating platforms, the blast zone
 *   CONNECTION .... MP_CONNECT, joining, the offline room, who is host
 *   FIGHTERS ...... running, jumping, attacks and getting launched (the same code for people and bots)
 *   MATCH (HOST) .. the countdown, stocks, the winner, the restart, and the bots. Only the host writes these.
 *   ME ............ my controls, my hits on others, my KOs. Each player writes only its own.
 *   DRAW .......... camera, sky, stage, fighters, sparks
 *   HUD & RESULTS . damage cards, countdown, results, leaderboard
 *   INPUT ......... keyboard, and a d-pad with Jump and Hit on touch
 *
 * HOW THE MULTIPLAYER WORKS (a relay room: no server code):
 *   - Each player writes its OWN entity: `p` (one packed JSON field: position, speed, facing,
 *     damage %, the attack it is doing, out/invincible) about 15 times a second, `hb`
 *     (heartbeat) once a second, and `n`/`c` (name, color) once. Your damage % is yours.
 *   - Hits: the ATTACKER sees its swing touch someone and sends "hit" {to, by, kx, ky, d}:
 *     a knockback direction and the damage. Only the one hit applies it to itself: its %
 *     goes up by d, and it flies off at knockBase + knockGrow × its new %. (The host does
 *     this for bots, and swings for them too.)
 *   - Falling past the blast zone is your own fact too: you send "ko" {n} (n counts your
 *     KOs, so the host never takes a stock twice) and come back from the sky if you have
 *     stocks left.
 *   - The HOST is the lowest sessionId among live players (heartbeat seen in the last 3s),
 *     worked out every frame. Only the host writes the shared fields `match` {id, v, phase:
 *     intro|fight|over, startAt, endsAt, stocks, names, ko, order, winner} and `bots`.
 *     Someone who joins mid-match takes a bot's seat. A new match = the host bumps match.id.
 *   - ?attract plays offline with bots only (the preview video is recorded from it).
 *   - Leaderboard "wins": +1 for every match you win, shown on the results card.
 */

// ── CONFIG ──────────────────────────────────────────────────────────────────────────
const CONFIG = {
  stocks: 3,             // lives each fighter starts a match with
  seats: 4,              // bots fill the match up to this many fighters
  introMs: 3000,         // countdown before a match
  resultsMs: 9000,       // ms the results show before the next match
  gravity: 2300,         // px/s²
  runSpeed: 340,         // px/s
  jump: 820,             // px/s up, first jump
  airJump: 740,          // px/s up, the extra jump you get in the air
  maxFall: 1100,         // px/s
  damage: 9,             // % one hit adds (up-hits a bit less, down-hits a bit more)
  knockBase: 380,        // px/s a hit at 0% sends you flying ...
  knockGrow: 8.5,        // ... plus this much for every % you already have
  respawnMs: 1500,       // ms off screen after a KO
  invincibleMs: 2000,    // ms nobody can hit you after you come back
  botReact: 0.35,        // seconds a bot waits (plus a random bit) before it swings
  board: "wins",         // leaderboard name
};
const BOT_NAMES = ["Bonk", "Mochi", "Rumble", "Pip", "Kazoo", "Tank"];
const COLORS = ["#ff5d73", "#4cc9f0", "#ffd166", "#06d6a0", "#c77dff", "#ff9f1c"];

// ── STAGE ───────────────────────────────────────────────────────────────────────────
// World px; y grows downward. The island is solid; thin platforms catch you from above and
// let you jump up through them (hold down to drop through). Leave the blast zone and you're KO'd.
const STAGE = { x1: 260, x2: 940, y: 560, depth: 120 };
const PLATFORMS = [{ x1: 320, x2: 490, y: 420 }, { x1: 710, x2: 880, y: 420 }, { x1: 515, x2: 685, y: 285 }];
const BLAST = { left: -360, right: 1560, top: -800, bottom: 1080 };
const SPAWNS = [[405, 420], [795, 420], [600, 285], [600, 560]];
const RESPAWN = { x: 600, y: 60 };
const BODY = { w: 40, h: 52 };
// Attacks: when the swing hurts (seconds after you press), where the hit box is, which way it launches.
const ATTACK = { time: 0.3, from: 0.05, to: 0.17 };
const MOVES = {
  side: { box: [8, -46, 58, 36], dir: [0.78, -0.62], dmg: 1 },     // box = [x ahead, y up, w, h] from your feet
  up: { box: [-30, -100, 60, 52], dir: [0.15, -1], dmg: 0.85 },
  down: { box: [-26, -12, 52, 46], dir: [0.3, 0.95], dmg: 1.2 },   // only in the air: a spike
};

// ── CONNECTION ──────────────────────────────────────────────────────────────────────
// The builder fills these in for this game. Downloaded from GitHub? Put your own pk_ key here.
const MP_CONNECT = {
  key: 'pk_REPLACE_ME',
  room: 'platform-brawl',
  endpoint: 'wss://live.multiplayeragent.com',
  apiUrl: 'https://api.multiplayeragent.com',
};
const ATTRACT = new URLSearchParams(location.search).has("attract");

/** Same shape as the SDK client, kept in this tab: offline play and ?attract. */
function localRoom() {
  const id = "local", state = { entities: { players: { [id]: {} } }, shared: {} }, subs = [];
  let queued = false;
  const emit = () => { if (!queued) { queued = true; queueMicrotask(() => { queued = false; subs.forEach((f) => f(state)); }); } };
  const put = (o, k, v) => { if (typeof k === "object") Object.assign(o, k); else o[k] = v; emit(); };
  return {
    sessionId: id, state, offline: true,
    me: { set: (k, v) => put(state.entities.players[id], k, v) },
    setShared: (k, v) => put(state.shared, k, v),
    onState: (f) => { subs.push(f); f(state); }, onJoin() {}, onLeave() {}, on() {}, send() {},
    onDisconnect() {}, onReconnect() {}, leave: async () => {},
  };
}
async function connect() {
  if (ATTRACT || typeof MP === "undefined") return localRoom();
  try {
    const mp = await Promise.race([MP.join({ ...MP_CONNECT }), new Promise((_, no) => setTimeout(() => no(new Error("timed out")), 10000))]);
    window.mp = mp; // the builder calls window.mp.leave() when the page closes
    return mp;
  } catch (e) {
    console.warn("Playing offline:", e && e.message);
    return localRoom();
  }
}
const parse = (v, fb) => { if (typeof v !== "string") return fb; try { return JSON.parse(v); } catch { return fb; } };
const parsed = new Map();
/** A JSON value from state, parsed once per change (read-only: never mutate what this returns). */
function parseOnce(key, raw, fallback) {
  const c = parsed.get(key);
  if (c && c.raw === raw) return c.v;
  const v = parse(raw, fallback); parsed.set(key, { raw, v }); return v;
}
let net = null, S = { entities: { players: {} }, shared: {} };
const seenHb = new Map();
/** Players whose heartbeat moved in the last 3s (plus us), sorted by sessionId. */
function livePlayers() {
  const now = performance.now(), out = [];
  for (const [id, p] of Object.entries(S.entities.players || {})) {
    const s = seenHb.get(id);
    if (!s || s.hb !== p.hb) seenHb.set(id, { hb: p.hb, at: now });
    if (id === net.sessionId || now - seenHb.get(id).at < 3000) out.push(id);
  }
  return out.sort();
}
const isHost = () => livePlayers()[0] === net.sessionId;

// ── FIGHTERS ────────────────────────────────────────────────────────────────────────
function newFighter(id, name, color) {
  return { id, name, color, x: RESPAWN.x, y: RESPAWN.y, vx: 0, vy: 0, face: 1, dmg: 0, ground: false, jumps: 2, stun: 0,
    atkT: 0, atkCd: 0, atkKind: "side", atkId: 0, hitSet: new Set(), out: 1, inv: 0, koN: 0, respawnAt: 0, land: 0 };
}
/** One physics step. ctl = { x: -1..1, jump, attack (pressed this frame), up, down (held) }. */
function physics(f, ctl, dt) {
  f.atkT = Math.max(0, f.atkT - dt); f.atkCd = Math.max(0, f.atkCd - dt); f.stun = Math.max(0, f.stun - dt); f.land = Math.max(0, f.land - dt * 5);
  if (f.stun <= 0) {
    if (ctl.x) {
      f.face = Math.sign(ctl.x);
      const want = ctl.x * CONFIG.runSpeed, step = (f.ground ? 5000 : 2600) * dt;
      if (Math.abs(f.vx) <= CONFIG.runSpeed + 1 || Math.sign(f.vx) !== Math.sign(ctl.x)) f.vx += Math.max(-step, Math.min(step, want - f.vx));
    } else if (f.ground) f.vx *= Math.pow(0.0004, dt);
    if (ctl.jump && f.jumps > 0) { f.vy = -(f.ground ? CONFIG.jump : CONFIG.airJump); f.jumps--; f.ground = false; burst(f.x, f.y, "#ffffffaa", 6, 120); }
    if (ctl.attack && f.atkCd <= 0) {
      f.atkKind = ctl.up ? "up" : !f.ground && ctl.down ? "down" : "side";
      f.atkT = ATTACK.time; f.atkCd = ATTACK.time + 0.06; f.atkId = (f.atkId + 1) % 1000; f.hitSet = new Set();
    }
  } else f.vx *= Math.pow(0.4, dt); // flying from a hit: the air slows you a little
  f.vy = Math.min(CONFIG.maxFall, f.vy + CONFIG.gravity * dt);
  if (!f.ground && ctl.down && f.vy > 0 && f.stun <= 0) f.vy = Math.max(f.vy, CONFIG.maxFall * 0.85); // fast fall
  const oldY = f.y, wasGround = f.ground;
  f.x += f.vx * dt; f.y += f.vy * dt; f.ground = false;
  for (const p of [STAGE, ...PLATFORMS]) { // land on anything below your feet
    if (f.vy < 0 || oldY > p.y + 2 || f.y < p.y || f.x < p.x1 - 14 || f.x > p.x2 + 14 || (p !== STAGE && ctl.down)) continue;
    if (f.stun > 0.15 && f.vy > 750) { f.y = p.y; f.vy *= -0.45; continue; } // launched into the floor: bounce
    f.y = p.y; f.vy = 0; f.ground = true; f.jumps = 2;
    if (!wasGround) f.land = 1;
  }
  // the island is solid: bump off its sides and its underside
  if (f.y > STAGE.y + 2 && f.y - BODY.h < STAGE.y + STAGE.depth && f.x > STAGE.x1 - 16 && f.x < STAGE.x2 + 16) {
    if (oldY - BODY.h >= STAGE.y + STAGE.depth - 24) { f.y = STAGE.y + STAGE.depth + BODY.h; f.vy = Math.max(60, f.vy); }
    else { f.x = f.x < (STAGE.x1 + STAGE.x2) / 2 ? STAGE.x1 - 16 : STAGE.x2 + 16; f.vx *= -0.2; }
  }
}
const swinging = (f) => { const e = ATTACK.time - f.atkT; return f.atkT > 0 && e >= ATTACK.from && e <= ATTACK.to; };
function hitBox(f) {
  const [ax, ay, w, h] = MOVES[f.atkKind].box;
  return f.atkKind === "side" ? { x: f.face > 0 ? f.x + ax : f.x - ax - w, y: f.y + ay, w, h } : { x: f.x + ax, y: f.y + ay, w, h };
}
const overlaps = (a, f) => a.x < f.x + BODY.w / 2 && a.x + a.w > f.x - BODY.w / 2 && a.y < f.y && a.y + a.h > f.y - BODY.h;
const outside = (f) => f.x < BLAST.left || f.x > BLAST.right || f.y < BLAST.top || f.y > BLAST.bottom;
/** Attacker `a` is mid-swing: who does it touch? Each swing hits each fighter once. */
function swingAt(a, targets) {
  if (!swinging(a)) return;
  const box = hitBox(a), mv = MOVES[a.atkKind];
  for (const t of targets) {
    if (t.id === a.id || t.out || t.inv > Date.now() || a.hitSet.has(t.id) || !overlaps(box, t)) continue;
    a.hitSet.add(t.id);
    const len = Math.hypot(mv.dir[0], mv.dir[1]);
    const hit = { to: t.id, by: a.id, kx: +(mv.dir[0] * a.face / len).toFixed(3), ky: +(mv.dir[1] / len).toFixed(3), d: Math.round(CONFIG.damage * mv.dmg) };
    burst(t.x, t.y - BODY.h / 2, "#fff", 10, 260); sfx("hit");
    if (t === me) applyHit(me, hit, a.id);
    else if (host.acting && host.bots.has(t.id)) applyHit(host.bots.get(t.id), hit, a.id);
    else net.send("hit", hit);
  }
}
/** I (or, on the host, a bot) got hit: take the damage and fly. The farther, the higher my %. */
function applyHit(f, hit, by) {
  if (f.out || f.inv > Date.now()) return;
  f.dmg = Math.min(999, f.dmg + Math.max(0, Math.min(30, Number(hit.d) || 0)));
  const speed = CONFIG.knockBase + f.dmg * CONFIG.knockGrow;
  f.vx = hit.kx * speed; f.vy = hit.ky * speed; f.ground = false; f.atkT = 0;
  f.stun = 0.12 + f.dmg * 0.0025; f.lastHitBy = by;
  if (f === me) { me.hurtAt = performance.now(); shake = Math.min(18, 4 + f.dmg / 10); sfx("hurt"); publish(true); }
}
function respawnFighter(f) {
  Object.assign(f, { x: RESPAWN.x + (Math.random() - 0.5) * 80, y: RESPAWN.y, vx: 0, vy: 0, dmg: 0, stun: 0, out: 0, jumps: 1, inv: Date.now() + CONFIG.invincibleMs });
}
function placeOnSpawn(f, m) {
  const [x, y] = SPAWNS[Math.max(0, Object.keys(m.stocks).indexOf(f.id)) % SPAWNS.length];
  Object.assign(f, { x, y, vx: 0, vy: 0, dmg: 0, stun: 0, out: m.stocks[f.id] > 0 ? 0 : 1, face: x < 600 ? 1 : -1, inv: 0, atkT: 0 });
}
/** The bot brain: get back to the island, chase someone, swing when close. */
function botControl(b, all, t) {
  const ctl = { x: 0, jump: false, attack: false, up: false, down: false };
  const offStage = b.x < STAGE.x1 - 10 || b.x > STAGE.x2 + 10 || b.y > STAGE.y + 20;
  if (offStage) { // recover: steer home, jump when falling
    ctl.x = Math.sign(600 - b.x);
    if (b.vy > 100 && b.jumps > 0 && t > (b.jumpAt || 0)) { ctl.jump = true; b.jumpAt = t + 250; }
    return ctl;
  }
  const foes = all.filter((f) => f.id !== b.id && !f.out);
  const tg = foes.find((f) => f.id === b.lastHitBy) || foes.sort((p, q) => Math.abs(p.x - b.x) + Math.abs(p.y - b.y) - Math.abs(q.x - b.x) - Math.abs(q.y - b.y))[0];
  if (!tg) return ctl;
  const dx = tg.x - b.x, dy = tg.y - b.y;
  if (Math.abs(dx) > 46) ctl.x = Math.sign(dx);
  const nextX = b.x + ctl.x * 40;
  if (b.ground && (nextX < STAGE.x1 + 20 || nextX > STAGE.x2 - 20) && (tg.x < STAGE.x1 || tg.x > STAGE.x2)) ctl.x = 0; // don't chase off the edge
  if (dy < -70 && b.ground && t > (b.jumpAt || 0)) { ctl.jump = true; b.jumpAt = t + 500 + Math.random() * 500; }
  if (dy > 60 && Math.abs(dx) < 120) ctl.down = true; // drop through a platform toward them
  if (Math.abs(dx) < 66 && Math.abs(dy) < 70 && t > (b.swingAt || 0)) {
    b.face = Math.sign(dx) || b.face; ctl.attack = true; ctl.up = dy < -40; ctl.down = dy > 30 && !b.ground;
    b.swingAt = t + (CONFIG.botReact + Math.random() * 0.35) * 1000;
  }
  return ctl;
}

// ── MATCH (HOST) ────────────────────────────────────────────────────────────────────
const host = { acting: false, last: null, bots: new Map(), lastBots: 0, again: false };
/** The match as state has it, or the host's own newer write that hasn't come back yet. `v` only goes up. */
function match() {
  const m = parseOnce("match", S.shared.match, null);
  return host.last && isHost() && (!m || host.last.v > m.v) ? host.last : m;
}
function writeMatch(m) { m = { ...m, v: (match()?.v ?? 0) + 1 }; host.last = m; net.setShared("match", JSON.stringify(m)); return m; }
const humansHere = () => livePlayers().filter((id) => !(ATTRACT && id === me.id));
function adopt() {
  host.acting = true; host.last = null; host.bots.clear();
  for (const b of parseOnce("bots", S.shared.bots, [])) host.bots.set(b.id, Object.assign(newFighter(b.id, b.name, b.color), b, { hitSet: new Set(), atkT: 0, koN: (match()?.ko || {})[b.id] || 0 }));
}
/** A fresh match: the people here plus bots up to CONFIG.seats, everyone on full stocks. */
function newMatch(id) {
  const humans = humansHere(), want = Math.max(0, CONFIG.seats - humans.length);
  while (host.bots.size > want) host.bots.delete([...host.bots.keys()].pop());
  while (host.bots.size < want) {
    const used = new Set([...host.bots.values()].map((b) => b.name)), colors = new Set([...humans.map(colorOf), ...[...host.bots.values()].map((b) => b.color)]);
    const bid = "b" + Math.random().toString(36).slice(2, 6);
    host.bots.set(bid, newFighter(bid, BOT_NAMES.find((n) => !used.has(n)) || "Bot", COLORS.find((c) => !colors.has(c)) || "#ccc"));
  }
  const stocks = {}, names = {};
  for (const fid of [...humans, ...host.bots.keys()]) { stocks[fid] = CONFIG.stocks; names[fid] = nameOf(fid); }
  const m = { id, phase: "intro", startAt: Date.now() + CONFIG.introMs, endsAt: 0, stocks, names, ko: {}, order: [], winner: null };
  for (const b of host.bots.values()) { placeOnSpawn(b, m); b.koN = 0; }
  return m;
}
/** Someone fell out (their own report, or a bot): one stock less. `n` makes a repeat harmless. */
function applyKo(id, n) {
  const m = match();
  if (!m || m.phase === "over" || !(m.stocks[id] > 0) || n <= (m.ko[id] || 0)) return;

function showBoard(won) {
  const list = $("board");
  if (!board) { list.innerHTML = "<li>Leaderboards need a connection.</li>"; return; }
  list.innerHTML = "<li>Loading…</li>";
  (won ? board.submit(1, "inc").catch(() => null) : Promise.resolve()).then(() => board.top(10)).then(({ entries }) => {
    list.innerHTML = entries.length ? entries.map((e) => `<li>${esc(e.username || "Player")}<span>${e.score}</span></li>`).join("") : "<li>No wins yet. Be the first.</li>";
  }).catch(() => { list.innerHTML = "<li>Couldn't load the leaderboard.</li>"; });
}
$("again").onclick = () => { if (isHost()) host.again = true; else net.send("again", {}); };
let audio = null; // made on the first tap or key (browsers block sound before that)
function sfx(kind) {
  if (!audio || ATTRACT) return;
  const [f0, f1, dur, vol, type] = { swing: [300, 500, 0.08, 0.03, "triangle"], hit: [220, 70, 0.14, 0.12, "square"], hurt: [180, 60, 0.2, 0.1, "sawtooth"], ko: [500, 40, 0.7, 0.14, "sawtooth"] }[kind];
  const t = audio.currentTime, o = audio.createOscillator(), g = audio.createGain();
  o.type = type; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f1, t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(audio.destination); o.start(t); o.stop(t + dur);
}

// ── INPUT ───────────────────────────────────────────────────────────────────────────
addEventListener("keydown", (e) => {
  const k = e.key.toLowerCase();
  if (["arrowleft", "arrowright", "arrowup", "arrowdown", " "].includes(k)) e.preventDefault();
  if (!e.repeat) pressed.add(k);
  keys.add(k);
});
addEventListener("keyup", (e) => keys.delete(e.key.toLowerCase()));
addEventListener("blur", () => keys.clear());
addEventListener("pointerdown", () => { try { audio ||= new AudioContext(); } catch {} }, { once: true });
const touchUI = matchMedia("(pointer: coarse)").matches && !ATTRACT;
$("dpad").hidden = $("acts").hidden = !touchUI;
for (const b of document.querySelectorAll(".pad button")) {
  const k = "pad:" + b.dataset.k;
  b.addEventListener("pointerdown", (e) => { e.preventDefault(); b.setPointerCapture(e.pointerId); keys.add(k); pressed.add(k); b.classList.add("on"); });
  for (const ev of ["pointerup", "pointercancel"]) b.addEventListener(ev, () => { keys.delete(k); b.classList.remove("on"); });
}
document.addEventListener("touchmove", (e) => e.preventDefault(), { passive: false });

// ── MAIN LOOP ───────────────────────────────────────────────────────────────────────
let last = performance.now(), lastHb = 0, lastHud = 0;
function frame(now) {
  const dt = Math.max(0, Math.min(0.033, (now - last) / 1000)); last = now; // never negative: the first frame can be stamped before `last`
  if (now - lastHb > 1000) { lastHb = now; net.me.set("hb", Date.now()); fixColor(); }
  if (isHost()) hostTick(dt, now); else host.acting = false;
  syncViews(dt);
  const m = match();
  if (m) myTick(dt, m);
  for (let i = sparks.length - 1; i >= 0; i--) { const p = sparks[i]; p.life -= dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 500 * dt; if (p.life <= 0) sparks.splice(i, 1); }
  for (let i = kos.length - 1; i >= 0; i--) if ((kos[i].t += dt) > 0.8) kos.splice(i, 1);
  draw(now / 1000);
  if (m && now - lastHud > 120) { lastHud = now; hud(m); }
  requestAnimationFrame(frame);
}

(async function start() {
  net = await connect();
  net.onState((st) => { S = st; });
  net.on("hit", (msg, from) => {
    if (!msg) return;
    const by = typeof msg.by === "string" ? msg.by : from, target = msg.to === me.id ? me : host.acting ? host.bots.get(msg.to) : null, a = views.get(by);
    if (target && (!a || Math.hypot(a.x - target.x, a.y - target.y) < 260)) applyHit(target, msg, by); // only from someone near the one hit
    const v = views.get(msg.to); if (v) burst(v.x, v.y - BODY.h / 2, "#fff", 8, 220);
  });
  net.on("ko", (msg, from) => { if (host.acting && msg) applyKo(from, Number(msg.n) || 0); });
  net.on("again", () => { if (host.acting) host.again = true; });
  net.onDisconnect(() => { dropped = true; $("net").textContent = "Reconnecting…"; });
  net.onReconnect(() => { dropped = false; });
  if (!net.offline && typeof MP !== "undefined") board = MP.auth({ key: MP_CONNECT.key, apiUrl: MP_CONNECT.apiUrl }).leaderboard(CONFIG.board);
  const taken = new Set([...Object.entries(S.entities.players || {}).filter(([id]) => id !== net.sessionId).map(([, p]) => p.c), ...parse(S.shared.bots, []).map((b) => b.color)]);
  me.id = net.sessionId; me.color = COLORS.find((c) => !taken.has(c)) || COLORS[Math.floor(Math.random() * COLORS.length)];
  net.me.set({ n: myName, c: me.color, hb: Date.now() });
  if (ATTRACT) Object.assign(CONFIG, { stocks: 4, introMs: 300, resultsMs: 1200, damage: 14, knockGrow: 11, respawnMs: 600, invincibleMs: 600, botReact: 0.15 });
  requestAnimationFrame(frame);
})();
</script>
